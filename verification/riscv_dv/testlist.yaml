# RVV 1.0 random-generation profiles for Ara DSA bring-up.

- test: ara_dsa_rvv1_signature_smoke
  description: Short deterministic-state RVV stream for full vector signature checking
  iterations: 1
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=10
    +num_of_sub_program=0
    +enable_vector_extension=1
    +vector_instr_only=1
    +vreg_init_method=RANDOM_VALUES_VMV
    +zvl_extension=1024
    +zve_extension=zve64x
    +no_fence=1
    +no_branch_jump=1
    +boot_mode=m
    +tvec_alignment=8
    +no_csr_instr=0
  rtl_test: core_base_test

- test: ara_dsa_rvv1_checkpoint_regression
  description: Ten-seed deterministic RVV stream for per-instruction vector and memory checking
  iterations: 10
  gen_test: riscv_instr_base_test
  gen_opts: >
    +instr_cnt=10
    +num_of_sub_program=0
    +enable_vector_extension=1
    +vector_instr_only=1
    +vreg_init_method=RANDOM_VALUES_VMV
    +vreg_ls_index_init=LS_INDEX_INIT_LFSR
    +directed_instr_0=riscv_vector_load_store_instr_stream,5
    +mem_region_size=4096
    +zvl_extension=1024
    +zve_extension=zve64x
    +no_fence=1
    +no_branch_jump=1
    +boot_mode=m
    +tvec_alignment=8
    +no_csr_instr=0
  rtl_test: core_base_test

